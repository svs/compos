<!doctype html>
<html>
<head>
<meta charset='utf-8'>
<title>compos C</title>
<style>
  body { margin: 0; padding: 24px; font: 13px/1.4 -apple-system, 'Helvetica Neue', sans-serif; background: #f4f1ea; color: #222; }
  .row { display: flex; gap: 24px; align-items: flex-end; margin-bottom: 16px; }
  .row div { text-align: center; color: #777; font-size: 11px; }
  textarea { width: 100%; height: 120px; font: 11px ui-monospace, monospace; }
</style>
</head>
<body>
<div class='row' id='sizes'></div>
<textarea id='out' spellcheck='false'></textarea>
<script>
// A C from three music marks, drawn as plain geometry, so no music font is needed.
// Each mark is one part of a single circle; where two marks meet, their inks multiply.
//   top:    a fermata (magenta), its arc over the top of the C and its dot inside the bowl.
//   left:   a slur (yellow), down the back of the C.
//   bottom: a bass clef (cyan), its ball at the lower tip of the C and its two dots in the mouth.
const INK = { cyan: '#00a3cc', magenta: '#e0147a', yellow: '#f7c600' };
const R = 100, W = 24;
const P = (a, r) => [r * Math.cos(a * Math.PI / 180), -r * Math.sin(a * Math.PI / 180)];
const pt = p => p.map(v => v.toFixed(1)).join(' ');
// A band along the circle from angle a0 to a1; h(t) is its half width, t going from 0 to 1.
function band(a0, a1, h) {
  const out = [], inn = [];
  for (let i = 0; i <= 64; i++) { const t = i / 64, a = a0 + (a1 - a0) * t; out.push(P(a, R + h(t))); inn.push(P(a, R - h(t))); }
  return `<path d='M ${[...out, ...inn.reverse()].map(pt).join(' L ')} Z'/>`;
}
const dot = (p, r) => `<circle cx='${p[0].toFixed(1)}' cy='${p[1].toFixed(1)}' r='${r}'/>`;
const swell = t => 1.5 + (W - 1.5) * Math.sin(Math.PI * t) ** 0.8;

const fermata = band(38, 162, swell) + dot(P(100, R * 0.42), W * 0.55);
const slur = band(142, 250, swell);
const bass = band(322, 196, t => 1.5 + (W - 1.5) * (1 - t) ** 0.7) + dot(P(322, R - 6), W * 1.2)
           + dot(P(13, R - 2), W * 0.42) + dot(P(-9, R - 2), W * 0.42);

const mark = (ink, body) => `<g fill='${INK[ink]}' style='mix-blend-mode:multiply'>${body}</g>`;
function svg(size) {
  return `<svg xmlns='http://www.w3.org/2000/svg' viewBox='-160 -160 320 320' width='${size}' height='${size}'>` +
    `<rect x='-160' y='-160' width='320' height='320' fill='#fbf9f4'/>` +
    `<g style='isolation:isolate'>${mark('yellow', slur)}${mark('magenta', fermata)}${mark('cyan', bass)}</g></svg>`;
}
document.getElementById('sizes').innerHTML = [360, 128, 64, 32, 16].map(s => `<div>${svg(s)}<br>${s}px</div>`).join('');
document.getElementById('out').value = svg(512);
</script>
</body>
</html>
