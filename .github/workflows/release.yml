# Builds the single-file compos executable for each target and attaches it
# to a GitHub release. Push a tag like v0.1.0 to publish one.
# Each target builds on its own runner: the Rust and C NIFs compile natively,
# so Burrito never cross-compiles them.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos_arm
          - os: ubuntu-24.04
            target: linux
    runs-on: ${{ matrix.os }}
    env:
      MIX_ENV: prod
      BURRITO_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5

      - name: Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.4.3"
          elixir-version: "1.19.5"
          version-type: strict

      - uses: dtolnay/rust-toolchain@stable

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: xz
        run: ${{ runner.os == 'macOS' && 'brew install xz' || 'sudo apt-get install -y xz-utils' }}

      - name: Build
        run: |
          mix local.hex --force && mix local.rebar --force
          mix deps.get
          mix release --overwrite
          ver="${GITHUB_REF_NAME#v}"
          mkdir dist
          cp burrito_out/compos_${{ matrix.target }} dist/compos-${ver}-${{ matrix.target }}

      - uses: actions/upload-artifact@v6
        with:
          name: compos-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
