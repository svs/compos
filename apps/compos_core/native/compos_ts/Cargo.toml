[package]
name = "compos_ts"
version = "0.1.0"
edition = "2021"

[lib]
name = "compos_ts"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.36"
streaming-iterator = "0.1"
libloading = "0.8"
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-elixir = "0.3"
tree-sitter-json = "0.24"
tree-sitter-rust = "0.24"
tree-sitter-html = "0.23.2"
tree-sitter-diff = "0.1.0"
# Markdown is built in: previews and chat prose draw through it, so a new
# home must not need `M-x ts-install-grammar markdown` first
tree-sitter-md = "0.5"

# Cargo strips a release build by default, and Xcode's strip (ld-27106)
# leaves this dylib's LINKEDIT string pool mis-aligned: dlopen refuses it.
# The release profile has no debuginfo to strip, and the unstripped file loads.
[profile.release]
strip = "none"
