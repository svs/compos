[package]
name = "compos_loro"
version = "0.1.0"
edition = "2021"

[lib]
name = "compos_loro"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gate"
path = "src/bin/gate.rs"

[dependencies]
rustler = "0.36"
# Pinned exactly. Loro is 1.x and still churns.
loro = "=1.13.9"

# The gate binary compares against the rope the buffer already uses.
ropey = "1.6"

[profile.release]
lto = true
