[package]
name = "compos-shell"
version = "0.1.0"
edition = "2021"
description = "Desktop shell for compos.el — a thin Tauri client over the editor daemon"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# the Dock icon: each daemon's shell wears that daemon's logo
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
lto = true
strip = true
